name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      eval:
        description: "Run the live agent eval (needs OPENROUTER_API_KEY secret)"
        type: boolean
        default: false
      models:
        description: "Comma-separated OpenRouter models to compare"
        default: "google/gemini-2.5-flash"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Agent core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # No Android SDK needed: :core is plain Kotlin, so this is the fast feedback loop.
      - run: ./gradlew :core:test -Paura.android=false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-reports
          path: core/build/reports/tests

  app:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Keys from repository secrets (never committed)
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"
            echo "SARVAM_API_KEY=${{ secrets.SARVAM_API_KEY }}"
          } > local.properties
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  eval:
    name: Live agent eval
    if: github.event_name == 'workflow_dispatch' && inputs.eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:eval -Paura.android=false --args="--models ${{ inputs.models }}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-transcripts
          path: core/build/eval
